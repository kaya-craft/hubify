name: Renovate

on:
    schedule:
        - cron: '0 0 * * 0'  # Every Sunday at midnight

jobs:
    renovate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
            - name: Run Renovate
              uses: renovatebot/github-action@v40.1.10
              with:
                token: ${{ secrets.GITHUB_TOKEN }}